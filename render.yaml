services:
  - type: web
    name: lunar-fusion-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./lunar_fusion.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: "http://localhost:8443,http://localhost:5173"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
